name: Refresh public housing data

on:
  schedule:
    - cron: '0 8 18 * *'
  workflow_dispatch:
    inputs:
      region:
        description: Region ID from config/regions.json
        default: peninsula-south-bay
        required: true

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Import latest data
        env:
          REGION: ${{ inputs.region || 'peninsula-south-bay' }}
        run: python3 scripts/refresh.py --region "$REGION"
      - name: Check importer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate source coverage
        run: python3 scripts/validate.py
      - name: Commit validated snapshot and run checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- public/data/; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/
          git commit -m 'data: refresh public housing snapshots'
          git push
          gh workflow run ci.yml --ref main
